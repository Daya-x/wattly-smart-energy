<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <pattern id="holes" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="17" cy="17" r="5.5" fill="#34404a"/>
      <circle cx="17" cy="17" r="2.5" fill="#101820"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity=".18"/>
    </filter>
    <style>
      .title{font:700 46px Arial,sans-serif;fill:#14212b}
      .heading{font:700 25px Arial,sans-serif;fill:#14212b}
      .label{font:600 21px Arial,sans-serif;fill:#24333d}
      .small{font:500 18px Arial,sans-serif;fill:#41515b}
      .pin{font:700 18px Arial,sans-serif;fill:#fff}
      .warning{font:700 23px Arial,sans-serif;fill:#d52222}
      .note{font:600 21px Arial,sans-serif;fill:#21313a}
    </style>
  </defs>

  <rect width="1600" height="1100" fill="#f7fafc"/>
  <text x="800" y="70" text-anchor="middle" class="title">ESP32 Breadboard Navigation Button Wiring</text>

  <!-- Breadboard -->
  <g filter="url(#shadow)">
    <rect x="55" y="115" width="1490" height="835" rx="26" fill="#f4f2ea" stroke="#bcc4c8" stroke-width="4"/>
    <rect x="85" y="250" width="1430" height="555" rx="10" fill="url(#holes)" opacity=".85"/>
    <rect x="85" y="510" width="1430" height="40" fill="#e5e8e8"/>
    <line x1="95" y1="175" x2="1505" y2="175" stroke="#e32c2c" stroke-width="8"/>
    <line x1="95" y1="890" x2="1505" y2="890" stroke="#202c35" stroke-width="8"/>
    <text x="105" y="158" class="heading" fill="#e32c2c">+ 3.3V rail</text>
    <text x="105" y="925" class="heading">− GND rail</text>
  </g>

  <!-- ESP32 board -->
  <g filter="url(#shadow)">
    <rect x="1130" y="245" width="330" height="520" rx="25" fill="#173c58" stroke="#0b2639" stroke-width="6"/>
    <rect x="1205" y="315" width="180" height="225" rx="8" fill="#c9ced2" stroke="#77828a" stroke-width="4"/>
    <path d="M1222 315v-30h24v30  M1260 315v-30h24v30  M1298 315v-30h24v30  M1336 315v-30h24v30"
          fill="none" stroke="#e8bf55" stroke-width="8"/>
    <text x="1295" y="405" text-anchor="middle" class="heading" fill="#21313a">ESP32</text>
    <text x="1295" y="438" text-anchor="middle" class="small">DEVKIT V1</text>
    <rect x="1240" y="685" width="110" height="68" rx="8" fill="#c8d0d5" stroke="#59656d" stroke-width="4"/>
    <text x="1295" y="728" text-anchor="middle" class="small">USB</text>

    <!-- Exact used pins -->
    <circle cx="1130" cy="335" r="12" fill="#22a85a" stroke="#fff" stroke-width="4"/>
    <text x="1154" y="342" class="pin">VP / GPIO36 / SP</text>

    <circle cx="1130" cy="435" r="12" fill="#1778d4" stroke="#fff" stroke-width="4"/>
    <text x="1154" y="442" class="pin">GPIO35</text>

    <circle cx="1460" cy="300" r="12" fill="#e32c2c" stroke="#fff" stroke-width="4"/>
    <text x="1368" y="307" class="pin">3V3</text>

    <circle cx="1460" cy="610" r="12" fill="#151c21" stroke="#fff" stroke-width="4"/>
    <text x="1385" y="617" class="pin">GND</text>
  </g>

  <!-- 3V3 and GND board connections -->
  <path d="M1460 300 H1490 V175" fill="none" stroke="#e32c2c" stroke-width="8" stroke-linejoin="round"/>
  <circle cx="1490" cy="175" r="10" fill="#e32c2c"/>
  <path d="M1460 610 H1490 V890" fill="none" stroke="#202c35" stroke-width="8" stroke-linejoin="round"/>
  <circle cx="1490" cy="890" r="10" fill="#202c35"/>

  <!-- LEFT circuit -->
  <text x="325" y="230" text-anchor="middle" class="heading" fill="#1778d4">LEFT BUTTON</text>
  <line x1="325" y1="175" x2="325" y2="270" stroke="#e32c2c" stroke-width="8"/>
  <rect x="298" y="270" width="54" height="150" rx="10" fill="#e4c27a" stroke="#4f3b23" stroke-width="4"/>
  <line x1="304" y1="300" x2="346" y2="300" stroke="#8b4b1c" stroke-width="8"/>
  <line x1="304" y1="325" x2="346" y2="325" stroke="#111" stroke-width="8"/>
  <line x1="304" y1="350" x2="346" y2="350" stroke="#e02929" stroke-width="8"/>
  <line x1="325" y1="420" x2="325" y2="505" stroke="#1778d4" stroke-width="8"/>
  <circle cx="325" cy="435" r="12" fill="#1778d4"/>
  <path d="M325 435 H1035 V435 H1130" fill="none" stroke="#1778d4" stroke-width="8"/>
  <rect x="265" y="505" width="120" height="100" rx="14" fill="#444b51" stroke="#12181c" stroke-width="5"/>
  <circle cx="325" cy="555" r="33" fill="#1c2328" stroke="#7f8b92" stroke-width="5"/>
  <line x1="325" y1="605" x2="325" y2="890" stroke="#202c35" stroke-width="8"/>
  <circle cx="325" cy="890" r="10" fill="#202c35"/>
  <text x="375" y="360" class="label">10kΩ pull-up</text>
  <text x="390" y="458" class="label" fill="#1778d4">GPIO35 signal row</text>

  <!-- RIGHT circuit -->
  <text x="755" y="230" text-anchor="middle" class="heading" fill="#22a85a">RIGHT BUTTON</text>
  <line x1="755" y1="175" x2="755" y2="270" stroke="#e32c2c" stroke-width="8"/>
  <rect x="728" y="270" width="54" height="150" rx="10" fill="#e4c27a" stroke="#4f3b23" stroke-width="4"/>
  <line x1="734" y1="300" x2="776" y2="300" stroke="#8b4b1c" stroke-width="8"/>
  <line x1="734" y1="325" x2="776" y2="325" stroke="#111" stroke-width="8"/>
  <line x1="734" y1="350" x2="776" y2="350" stroke="#e02929" stroke-width="8"/>
  <line x1="755" y1="420" x2="755" y2="605" stroke="#22a85a" stroke-width="8"/>
  <circle cx="755" cy="480" r="12" fill="#22a85a"/>
  <path d="M755 480 H1010 V335 H1130" fill="none" stroke="#22a85a" stroke-width="8" stroke-linejoin="round"/>
  <rect x="695" y="605" width="120" height="100" rx="14" fill="#444b51" stroke="#12181c" stroke-width="5"/>
  <circle cx="755" cy="655" r="33" fill="#1c2328" stroke="#7f8b92" stroke-width="5"/>
  <line x1="755" y1="705" x2="755" y2="890" stroke="#202c35" stroke-width="8"/>
  <circle cx="755" cy="890" r="10" fill="#202c35"/>
  <text x="805" y="360" class="label">10kΩ pull-up</text>
  <text x="805" y="505" class="label" fill="#22a85a">GPIO36 signal row</text>

  <!-- Notes -->
  <rect x="165" y="985" width="1270" height="80" rx="18" fill="#fff" stroke="#c7d0d5" stroke-width="3"/>
  <text x="800" y="1022" text-anchor="middle" class="note">Each button has its own 10kΩ resistor from 3.3V to its GPIO signal row.</text>
  <text x="800" y="1053" text-anchor="middle" class="warning">Use 3.3V only — do not connect these inputs to 5V</text>
</svg>
