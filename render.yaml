services:
  - type: web
    name: wattly-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    envVars:
      - key: FIREBASE_PROJECT_ID
        value: wattly-smart-energy-2026
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-service-account.json
      - key: PERSISTENCE_BACKEND
        value: firestore
      - key: PERSISTENCE_STRICT
        value: "true"
      - key: PERSISTENCE_SAMPLE_SECONDS
        value: "60"
      - key: REQUIRE_USER_AUTH
        value: "true"
      - key: DEVICE_API_KEY
        sync: false
      - key: TARIFF_ADMIN_KEY
        sync: false
    secretFiles:
      - key: firebase-service-account.json
        sync: false
